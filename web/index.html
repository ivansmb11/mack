<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mack · mack.ivanmendoza.dev</title>
<style>
  :root { --bg:#0b0d0c; --panel:#121614; --line:#1f2622; --fg:#d7e3dc; --dim:#7d8c84; --accent:#3cff8f; --warn:#ffb547; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display:flex; align-items:baseline; gap:1rem; padding:1.25rem 1.5rem; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.1rem; color:var(--accent); letter-spacing:.08em; }
  header span { color:var(--dim); }
  main { display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:1rem; padding:1.5rem; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1rem 1.25rem; }
  h2 { margin:0 0 .75rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:.35rem .25rem; border-bottom:1px solid var(--line); font-weight:normal; }
  th { color:var(--dim); font-size:.75rem; }
  .up { color:var(--accent); } .down { color:var(--bad); } .warn { color:var(--warn); } .num { text-align:right; font-variant-numeric: tabular-nums; }
  .big { font-size:1.8rem; color:var(--accent); }
  textarea, input, select, button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.5rem; }
  textarea { width:100%; min-height:6rem; resize:vertical; }
  button { cursor:pointer; border-color:var(--accent); color:var(--accent); }
  pre { white-space:pre-wrap; color:var(--fg); max-height:22rem; overflow:auto; }
  .row { display:flex; gap:.5rem; margin-top:.5rem; }
</style>
</head>
<body>
<header><h1>MACK</h1><span>dsa · matrix · factory · ledger</span><span id="status"></span></header>
<main>
  <section><h2>Agentes</h2><table id="agents"></table></section>
  <section><h2>Ledger · mes actual</h2><div id="ledger"></div></section>
  <section style="grid-column: 1 / -1"><h2>Factory · Sandcastle</h2><table id="jobs"></table></section>
  <section style="grid-column: 1 / -1">
    <h2>Matrix</h2>
    <textarea id="task" placeholder="Tarea para un DSA…"></textarea>
    <div class="row"><select id="agent"><option value="">auto (enrutar)</option></select><button id="send">Despachar</button></div>
    <pre id="out"></pre>
  </section>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem("mackToken") || prompt("MACK_TOKEN");
  localStorage.setItem("mackToken", token);
  const api = async (path, init = {}) => {
    const res = await fetch(path, { ...init, headers: { authorization: `Bearer ${token}`, "content-type": "application/json" } });
    if (res.status === 401) { localStorage.removeItem("mackToken"); location.reload(); }
    return res.status === 204 ? null : res.json();
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const fmt = (n) => Intl.NumberFormat("es-MX").format(n);

  async function refresh() {
    const [agents, health, ledger, jobs] = await Promise.all([
      api("/api/agents"), api("/api/agents/health"), api("/api/ledger/summary"), api("/api/factory/jobs?limit=10"),
    ]);
    const jobColor = { done: "up", failed: "down", incomplete: "warn" };
    $("jobs").innerHTML = "<tr><th>job</th><th>repo</th><th>rama</th><th>flujo</th><th>estado</th><th class=\"num\">commits</th></tr>" +
      jobs.map((j) => `<tr title="${esc(j.task)}"><td>${j.id}</td><td>${esc(j.repo.split("/").pop())}</td><td>${esc(j.branch)}</td>
        <td>${j.workflow}</td><td class="${jobColor[j.status] ?? ""}">${j.status}</td><td class="num">${j.commits.length}</td></tr>`).join("");
    const up = Object.fromEntries(health.map((h) => [h.agent, h.up]));
    $("agents").innerHTML = "<tr><th>nombre</th><th>tipo</th><th>modelo</th><th>puerto</th><th></th></tr>" +
      agents.map((a) => `<tr><td>${esc(a.name)}</td><td>${a.kind}</td><td>${esc(a.model)}</td><td>${a.port}</td>
        <td class="${up[a.name] ? "up" : "down"}">${up[a.name] ? "● up" : "○ down"}</td></tr>`).join("");
    $("agent").innerHTML = '<option value="">auto (enrutar)</option>' +
      agents.filter((a) => a.kind === "dsa").map((a) => `<option>${esc(a.name)}</option>`).join("");
    $("ledger").innerHTML = `<div class="big">$${ledger.totalUsd.toFixed(2)} USD</div>
      <div style="color:var(--dim)">medido $${ledger.meteredUsd.toFixed(2)} · suscripciones $${ledger.subscriptionsUsd.toFixed(2)} · sin precio ${fmt(ledger.unpricedTokens)} tok</div>
      <table><tr><th>agente</th><th class="num">tokens</th><th class="num">presupuesto</th></tr>
      ${ledger.perAgent.map((a) => `<tr><td>${esc(a.agent)}</td><td class="num">${fmt(a.tokens)}</td>
        <td class="num">${a.budget?.monthlyTokens ? fmt(a.budget.monthlyTokens) : "—"}</td></tr>`).join("")}</table>
      <h2 style="margin-top:1rem">Suscripciones</h2><table>
      ${ledger.subscriptions.map((s) => `<tr><td>${esc(s.provider)} · ${esc(s.plan)}</td><td class="num">$${s.monthlyUsd}</td><td>${s.renewsOn ?? ""}</td></tr>`).join("")}</table>`;
    $("status").textContent = new Date().toLocaleTimeString("es-MX");
  }

  $("send").onclick = async () => {
    $("out").textContent = "…";
    const body = { task: $("task").value, ...($("agent").value ? { agent: $("agent").value } : {}) };
    const r = await api("/api/matrix/dispatch", { method: "POST", body: JSON.stringify(body) });
    $("out").textContent = r.message ?? `[${r.agent || "—"} · ${r.status}]\n\n${r.content}`;
    refresh();
  };
  refresh(); setInterval(refresh, 30_000);
</script>
</body>
</html>
