domain: mack.ivanmendoza.dev

server:
  host: 127.0.0.1
  port: 7777

hermes:
  bin: hermes
  home: ~/.hermes
  orchestrator: mack
  # Hermes ≥ 0.23 runs one host gateway (default profile) whose API server fronts every
  # profile at <apiUrl>/p/<profile>/v1, each authenticated with that profile's own key.
  apiUrl: http://127.0.0.1:8642
  # Secrets copied from the orchestrator's .env into every new DSA.
  # Messaging-platform tokens are excluded on purpose: only Mack talks to you.
  inheritEnv: [ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, NOUS_API_KEY, GEMINI_API_KEY]

dataDir: ~/.mack

# Factory: Sandcastle coding agents in Docker, one branch per job, never pushed.
factory:
  imageName: sandcastle:mack
  defaultModel: claude-opus-5-5
  maxConcurrent: 2
  # Mounted read-only at ~/.claude/skills in every sandbox.
  skillPacks: [matt-pocock-engineering, matt-pocock-thinking]
  # Jobs may only target git repos under these roots.
  repoRoots: [~/repos]

# USD per million tokens. Models missing here are recorded as "unpriced":
# tokens still count toward token budgets, USD budgets ignore them.
# Fill in from each provider's pricing page, keyed by model id:
#   <model-id>: { inputPerMTok: <usd>, outputPerMTok: <usd> }
pricing: {}
